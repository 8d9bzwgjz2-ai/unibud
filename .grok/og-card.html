<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Fraunces Display";
      src: url("fonts/Fraunces-Roman.ttf") format("truetype");
      font-weight: 300 900;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Fraunces Display";
      src: url("fonts/Fraunces-Italic.ttf") format("truetype");
      font-weight: 300 900;
      font-style: italic;
      font-display: block;
    }
    @font-face {
      font-family: "Outfit Text";
      src: url("fonts/Outfit.ttf") format("truetype");
      font-weight: 100 900;
      font-style: normal;
      font-display: block;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #f3eee4;
    }
    .card {
      width: 1200px;
      height: 630px;
      display: grid;
      grid-template-columns: 1fr 548px;
      background: #f3eee4;
      color: #12110e;
    }
    .copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 48px 0 68px;
    }
    .kicker {
      font-family: "Outfit Text", sans-serif;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #6d5528;
      line-height: 1.45;
      max-width: 34em;
    }
    h1 {
      margin-top: 18px;
      font-family: "Fraunces Display", serif;
      font-weight: 560;
      font-style: normal;
      font-size: 104px;
      line-height: 0.86;
      letter-spacing: -0.035em;
      font-variation-settings: "opsz" 144, "wght" 560, "SOFT" 20, "WONK" 1;
      color: #12110e;
    }
    .rule {
      width: 76px;
      height: 2px;
      margin: 26px 0 20px;
      background: #c4a36a;
    }
    .tag {
      font-family: "Fraunces Display", serif;
      font-style: italic;
      font-weight: 440;
      font-size: 30px;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: #4e483f;
      font-variation-settings: "opsz" 48, "wght" 440, "SOFT" 30, "WONK" 1;
    }
    .photos {
      display: grid;
      grid-template-rows: 1.18fr 1fr;
      gap: 8px;
      padding: 10px 10px 10px 0;
    }
    .pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      min-height: 0;
    }
    .photos img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .hero { object-position: 50% 62%; }
    .food { object-position: 50% 45%; }
    .goods { object-position: 50% 55%; }
  </style>
</head>
<body>
  <div class="card">
    <div class="copy">
      <p class="kicker">Goods · Food · Services<br>Property · Short stays</p>
      <h1>UNIBUD</h1>
      <div class="rule"></div>
      <p class="tag">Things worth listing.</p>
    </div>
    <div class="photos">
      <img class="hero" src="file:///workspace/public/listings/lekki.jpg" alt="" />
      <div class="pair">
        <img class="food" src="file:///workspace/public/listings/jollof.jpg" alt="" />
        <img class="goods" src="file:///workspace/public/listings/camera.jpg" alt="" />
      </div>
    </div>
  </div>
</body>
</html>
