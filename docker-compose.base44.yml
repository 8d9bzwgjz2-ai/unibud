name: unibud

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: unibud
      POSTGRES_PASSWORD: unibud_dev_pw
      POSTGRES_DB: unibud
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unibud -d unibud"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: on-failure
    labels:
      base44.kind: infra

  api:
    image: node:22-bookworm-slim
    working_dir: /app
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    environment:
      DATABASE_URL: postgres://unibud:unibud_dev_pw@db:5432/unibud
      PORT: "3001"
      NODE_ENV: development
    volumes:
      - ./server:/app
      - api-modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: on-failure
    labels:
      base44.project: UNIBUD
      base44.kind: api

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command:
      ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000"]
    environment:
      API_URL: http://api:3001
      # Sandbox preview support only; unset outside the sandbox.
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
      BASE44_SANDBOX_HOST_DOMAIN: ${BASE44_SANDBOX_HOST_DOMAIN:-}
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX:-}
    volumes:
      - ./web:/app
      - web-modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: on-failure
    labels:
      base44.project: UNIBUD
      base44.kind: web
      base44.port: "3000"

volumes:
  db-data:
  api-modules:
  web-modules:
