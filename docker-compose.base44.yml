name: unibud

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: unibud
      POSTGRES_PASSWORD: unibud_dev_pw
      POSTGRES_DB: unibud
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unibud -d unibud"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: on-failure
    labels:
      base44.kind: infra

  web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /app
    command:
      - sh
      - -ec
      - npm run db:migrate && exec npm run dev
    env_file:
      - /run/base44/app.env
    environment:
      # Local infrastructure credential (not a user secret).
      DATABASE_URL: postgres://unibud:unibud_dev_pw@db:5432/unibud
      NODE_ENV: development
      # Sandbox preview support only; unset outside the sandbox.
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX:-}
      BASE44_SANDBOX_HOST_DOMAIN: ${BASE44_SANDBOX_HOST_DOMAIN:-}
      # Vite >= 6.1 appends this to `server.allowedHosts`; the platform sets it.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:-}
    volumes:
      - ./:/app
      - app-modules:/app/node_modules
    ports:
      - "3000:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    restart: on-failure
    labels:
      base44.project: UNIBUD
      base44.kind: web
      base44.port: "3000"

volumes:
  db-data:
  app-modules:
