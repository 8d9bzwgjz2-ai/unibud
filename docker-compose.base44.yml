# Base44 sandbox environment for UNIBUD.
#
# The app runs from the bind-mounted working tree with the Vite dev server, so
# every edit is live. Postgres runs as a plain infrastructure service; app
# secrets are delivered by the platform to /run/base44/app.env.
name: unibud

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: unibud
      POSTGRES_PASSWORD: unibud_local_dev_only
      POSTGRES_DB: unibud
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unibud -d unibud"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    image: node:22-bookworm
    working_dir: /app
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - DATABASE_URL=postgresql://unibud:unibud_local_dev_only@db:5432/unibud
    command: ["sh", "-ec", "sh scripts/base44-dev.sh && npm run db:migrate"]

  app:
    image: node:22-bookworm
    restart: on-failure
    working_dir: /app
    ports:
      # The preview proxy expects the web entry point on host port 3000.
      - "3000:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      # Platform-managed secrets (BETTER_AUTH_SECRET) — always last so the
      # dashboard value wins over anything declared here.
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
      - BASE44_PREVIEW_MODE
      # Vite appends this to `server.allowedHosts` so the preview host is accepted.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      # VITE_AUTH_ENABLED is not set here: `.grok/app-env.json` is the app's own
      # sign-in state and the wrapper below applies it to dev and build alike.
      - DATABASE_URL=postgresql://unibud:unibud_local_dev_only@db:5432/unibud
      # Same-origin Better Auth origin for the preview proxy host, so credentialed
      # auth POSTs from the preview page are not rejected as an invalid origin.
      - BETTER_AUTH_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    command: ["sh", "-ec", "sh scripts/base44-dev.sh && exec npm run dev"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:8080/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

volumes:
  pgdata:
  node_modules:
